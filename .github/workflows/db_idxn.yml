#file: noinspection YAMLSchemaValidation
name: Danbooru Index (N)

on:
  #  push:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * 0,3'

jobs:
  unittest:
    name: Code Test Newest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree cloc wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Add 12G swap
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          echo "=== Before ==="
          free -h
          swapon --show || true
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=12288 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== After ==="
          free -h
          swapon --show
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flake8 setuptools wheel twine
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          pip list
          tree .
          cloc inf
          cloc test
      - name: Start memory monitor
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "=== $(date -Is) ==="; free -m; sleep 30; done' > mem.log 2>&1 &
          echo $! > mem-monitor.pid
      - name: Run unittest
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_DB_N: ${{ secrets.REMOTE_REPOSITORY_DB_N }}
          DANBOORU_USERNAME: ${{ secrets.DANBOORU_USERNAME }}
          DANBOORU_APITOKEN: ${{ secrets.DANBOORU_APITOKEN }}
        shell: bash
        run: |
          python -m inf.danbooru.index_n
      - name: Stop memory monitor
        if: always()
        shell: bash
        run: |
          if [ -f mem-monitor.pid ]; then
            kill "$(cat mem-monitor.pid)" 2>/dev/null || true
            rm -f mem-monitor.pid
          fi
          if [ -f mem.log ]; then
            echo "=== Peak memory usage ==="
            awk '/^Mem:/ { used = $3; if (used+0 > peak+0) peak = used } END { print "peak used MB:", peak }' mem.log || true
            echo "=== Last 20 samples ==="
            tail -n 80 mem.log || true
          fi
      - name: Upload memory log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mem-log
          path: mem.log
          if-no-files-found: ignore
