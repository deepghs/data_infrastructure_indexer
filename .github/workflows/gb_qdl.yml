#file: noinspection YAMLSchemaValidation
name: Gelbooru Quick DL

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop scheduling work after this duration (e.g. 5h, 20m)'
        required: false
        default: '5h'
      max_volumes:
        description: 'Stop after this many volumes (empty means unlimited; use 1 for a smoke run)'
        required: false
        default: ''
      download_workers:
        description: 'Concurrent download threads. Above 8 the image host starts answering 404 for files that exist.'
        required: false
        default: '8'
      initial_rate:
        description: 'Requests per second the adaptive limiter starts from'
        required: false
        default: '4'
      dry_run:
        description: 'Download and build volumes, upload nothing'
        required: false
        default: 'false'
  # Every six hours while the first backlog is worked off: a run stops starting volumes after five hours
  # and needs a little more to upload the last one, so the next trigger finds the job idle and starts it
  # at once. About 2.6 million images, roughly 6.5 TB, are missing; at the 13 to 16 MB/s a runner gets from
  # the image host that is five to seven days. Afterwards the site adds about 7000 images a day, which one
  # short run clears, and the cadence can drop to once a day. Runs never overlap: the concurrency group
  # queues a second one behind the first, because each commit rewrites the table from a snapshot read at start.
  schedule:
    - cron: '33 */6 * * *'

concurrency:
  group: gb-qdl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quick_dl:
    name: Gelbooru Quick DL
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload to finish.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Free disk space
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          echo "=== Before ==="
          df -h /
          # Preinstalled toolchains this job never uses; removing them roughly doubles the
          # space available for tar volumes.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== After ==="
          df -h /
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Start disk monitor
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "=== $(date -Is) ==="; df -h / | tail -n 1; sleep 60; done' > disk.log 2>&1 &
          echo $! > disk-monitor.pid
      - name: Run quick_dl
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_HUB_ENABLE_HF_TRANSFER: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_GB: ${{ secrets.REMOTE_REPOSITORY_GB }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_VOLUMES: ${{ github.event.inputs.max_volumes || '' }}
          DOWNLOAD_WORKERS: ${{ github.event.inputs.download_workers || '8' }}
          INITIAL_RATE: ${{ github.event.inputs.initial_rate || '4' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          EXTRA=()
          if [ -n "$MAX_VOLUMES" ]; then
            EXTRA+=(--max-volumes "$MAX_VOLUMES")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          python -m inf.gelbooru.quick_dl \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --download-workers "$DOWNLOAD_WORKERS" \
            --initial-rate "$INITIAL_RATE" \
            "${EXTRA[@]}"
      - name: Stop disk monitor
        if: always()
        shell: bash
        run: |
          if [ -f disk-monitor.pid ]; then
            kill "$(cat disk-monitor.pid)" 2>/dev/null || true
            rm -f disk-monitor.pid
          fi
          if [ -f disk.log ]; then
            echo "=== Lowest free space observed ==="
            grep -oE '[0-9.]+[MG]? +[0-9]+%' disk.log | tail -n 5 || true
            echo "=== Last samples ==="
            tail -n 20 disk.log || true
          fi
          df -h /
      - name: Upload disk log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-log
          path: disk.log
          if-no-files-found: ignore
