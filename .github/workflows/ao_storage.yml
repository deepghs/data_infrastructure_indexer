#file: noinspection YAMLSchemaValidation
name: Asiaon Storage

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop starting new posts after this duration. The batch in flight still has to finish
          and upload, so leave room under the 350 minute job limit.'
        required: false
        default: '5h'
      max_posts:
        description: 'Attempt at most this many posts, stored, gone or failed. Empty means no limit.'
        required: false
        default: ''
      max_dead_streak:
        description: 'Stop after this many posts in a row with nothing alive. 0 tries every candidate, which
          is what a one-off sweep of the old posts wants.'
        required: false
        default: '200'
      created_before:
        description: 'Only posts created before this date, YYYY-MM-DD (UTC). Empty means no limit. The old
          posts are the ones whose links are still dying, so they can be swept ahead of the new ones.'
        required: false
        default: ''
      created_after:
        description: 'Only posts created on or after this date, YYYY-MM-DD (UTC). Empty means no limit.'
        required: false
        default: ''
      dry_run:
        description: 'Download, unpack and repack, but upload nothing.'
        required: false
        default: 'false'
  # Four times a day, six hours apart, starting an hour after the asiaon index (04:25 UTC) so the index has
  # published before the first run reads it; the cosplaytele storage (09:25 UTC) has its own slot. A run
  # stops starting new posts after five hours and needs about twenty more minutes to finish and upload its
  # last batch, so consecutive runs leave a gap of about forty minutes and do not queue. The backlog is worked
  # off newest first across as many runs as it takes. Runs never overlap: the concurrency group queues a
  # second one behind the first, because each commit rewrites the tables from a snapshot read at start.
  schedule:
    - cron: '25 5,11,17,23 * * *'

concurrency:
  group: ao-storage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ao_storage:
    name: Asiaon Storage
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes. New posts stop being started at 5h, which leaves time for
    # the batch in flight to upload; the largest package seen is about 4.4 GB.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          persist-credentials: false
      - name: Set up system dependencies on Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          # 7z unpacks the archives, and node computes the gofile token inside its permission sandbox.
          command -v 7z
          command -v node
          7z | head -n 2 || true
          node --version
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Run asiaon storage
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: '1'
          REMOTE_REPOSITORY_AO: ${{ secrets.REMOTE_REPOSITORY_AO }}
          REMOTE_REPOSITORY_AO_S1: ${{ secrets.REMOTE_REPOSITORY_AO_S1 }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_POSTS: ${{ github.event.inputs.max_posts || '' }}
          MAX_DEAD_STREAK: ${{ github.event.inputs.max_dead_streak || '200' }}
          CREATED_BEFORE: ${{ github.event.inputs.created_before || '' }}
          CREATED_AFTER: ${{ github.event.inputs.created_after || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          EXTRA=()
          if [ -n "$MAX_POSTS" ]; then
            EXTRA+=(--max-posts "$MAX_POSTS")
          fi
          if [ -n "$CREATED_BEFORE" ]; then
            EXTRA+=(--created-before "$CREATED_BEFORE")
          fi
          if [ -n "$CREATED_AFTER" ]; then
            EXTRA+=(--created-after "$CREATED_AFTER")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          python -m inf.asiaon.storage \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-dead-streak "$MAX_DEAD_STREAK" \
            "${EXTRA[@]}"
