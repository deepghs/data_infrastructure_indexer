#file: noinspection YAMLSchemaValidation
name: Fancaps Quick DL

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop scheduling work after this duration (e.g. 5h, 20m)'
        required: false
        default: '5h'
      max_volumes:
        description: 'Stop after this many volumes (empty means unlimited; use 1 for a smoke run)'
        required: false
        default: ''
      workers_per_lane:
        description: 'Download threads per egress address; they share that address pacer'
        required: false
        default: '3'
      rate_per_ip:
        description: 'Requests per second one egress address may carry (measured on hosted runners: 3.5 for 25 minutes without a single block, Cloudflare error 1015 starts at about 4 and bans the address for an hour)'
        required: false
        default: '3.0'
      min_publish_gb:
        description: 'Publish nothing unless this many GB are pending, and never a trailing volume below it (0 turns the bar off)'
        required: false
        default: '6'
      max_publish_days:
        description: 'Waive the bar once the newest volume is this many days old (empty never waives it)'
        required: false
        default: '25'
      force:
        description: 'Waive the bar for this run'
        required: false
        default: 'false'
      use_proxy:
        description: 'Add the Bright Data proxy pool as extra egress addresses (needs a zone that accepts any client address)'
        required: false
        default: 'false'
      proxy_lanes:
        description: 'Proxy addresses to use when use_proxy is true'
        required: false
        default: '8'
      dry_run:
        description: 'Download and build volumes, upload nothing'
        required: false
        default: 'false'
  # Three runs a week, Monday, Wednesday and Friday, a little after the daily index job has had time to finish
  # (GitHub starts scheduled runs hours late, the index job lands between 01:00 and 05:00 UTC).
  #
  # What a run can do. One hosted runner has one address, which Cloudflare lets through at about 3.5 requests a
  # second. At the 3.0 used here, five hours are about 54,000 images, about 8.6 GB, so a run publishes one volume.
  # What the site produces. About 3 to 17 GB a week, 6 GB in the first measured week; the mean image is 159 KB.
  # So a run every two or three days finds 1 to 7 GB pending, which would be a small volume on a quiet week. The
  # bar makes the schedule safe on both sides: a run publishes only when about 6 GB are pending (volumes come out at
  # 6 to 8 GB) and a pending tail below the bar waits for a later run; once the newest volume is 25 days old the bar
  # is waived, so data never lags by more than about a month. A skipped run costs about three minutes.
  #
  # Runs never overlap: the concurrency group queues a second one behind the first, because each commit rewrites the
  # table from a snapshot read at start. Do not run this while another process is writing to the same repository.
  schedule:
    - cron: '47 7 * * 1,3,5'

concurrency:
  group: fc-qdl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quick_dl:
    name: Fancaps Quick DL
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload to finish.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Free disk space
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          echo "=== Before ==="
          df -h /
          # Preinstalled toolchains this job never uses; removing them roughly doubles the
          # space available for tar volumes.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== After ==="
          df -h /
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Start disk monitor
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "=== $(date -Is) ==="; df -h / | tail -n 1; free -m | sed -n 2p; sleep 60; done' > disk.log 2>&1 &
          echo $! > disk-monitor.pid
      - name: Run quick_dl
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_HUB_ENABLE_HF_TRANSFER: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BRD_PROXY_URL: ${{ secrets.BRD_PROXY_URL }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_VOLUMES: ${{ github.event.inputs.max_volumes || '' }}
          WORKERS_PER_LANE: ${{ github.event.inputs.workers_per_lane || '3' }}
          RATE_PER_IP: ${{ github.event.inputs.rate_per_ip || '3.0' }}
          MIN_PUBLISH_GB: ${{ github.event.inputs.min_publish_gb || '6' }}
          MAX_PUBLISH_DAYS: ${{ github.event.inputs.max_publish_days || '25' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          USE_PROXY: ${{ github.event.inputs.use_proxy || 'false' }}
          PROXY_LANES: ${{ github.event.inputs.proxy_lanes || '8' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        shell: bash
        run: |
          is_number() { [[ "$1" =~ ^[0-9]+(\.[0-9]+)?$ ]]; }
          for name in RATE_PER_IP MIN_PUBLISH_GB WORKERS_PER_LANE PROXY_LANES; do
            if ! is_number "${!name}"; then echo "Input $name is not a number: ${!name}"; exit 2; fi
          done
          EXTRA=()
          if [ -n "$MAX_VOLUMES" ]; then
            EXTRA+=(--max-volumes "$MAX_VOLUMES")
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA+=(--dry-run)
          fi
          if [ "$FORCE" = "true" ]; then
            EXTRA+=(--force)
          fi
          MIN_BYTES=$(awk -v g="$MIN_PUBLISH_GB" 'BEGIN { printf "%d", g * 1073741824 }')
          EXTRA+=(--min-publish-bytes "$MIN_BYTES")
          if [ -n "$MAX_PUBLISH_DAYS" ]; then
            if ! is_number "$MAX_PUBLISH_DAYS"; then echo "Input MAX_PUBLISH_DAYS is not a number: $MAX_PUBLISH_DAYS"; exit 2; fi
            EXTRA+=(--max-publish-interval "${MAX_PUBLISH_DAYS}d")
          fi
          # The runner's own address is always one egress slot (--direct); the proxy pool adds more.
          if [ "$USE_PROXY" = "true" ] && [ -n "$BRD_PROXY_URL" ]; then
            echo "Adding $PROXY_LANES proxy addresses from the Bright Data pool."
            EXTRA+=(--proxy-pool "$BRD_PROXY_URL" --proxy-lanes "$PROXY_LANES" --direct)
          fi
          python -m inf.fancaps.quick_dl \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --workers-per-lane "$WORKERS_PER_LANE" \
            --rate-per-ip "$RATE_PER_IP" \
            "${EXTRA[@]}" 2>&1 | tee quick_dl.log
      - name: Summarize the run
        if: always()
        shell: bash
        run: |
          if [ -f quick_dl.log ]; then
            {
              echo '### Fancaps Quick DL'
              echo '```text'
              tr '\r' '\n' < quick_dl.log | grep -E 'candidates to download|bar|Egress ready|Building volume|Volume #[0-9]+ downloaded|UPLOAD volume #[0-9]+ done|RETIRE|BREAKER|ABORT|Done,|Traceback|Error' | cut -c1-240 | tail -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop disk monitor
        if: always()
        shell: bash
        run: |
          if [ -f disk-monitor.pid ]; then
            kill "$(cat disk-monitor.pid)" 2>/dev/null || true
            rm -f disk-monitor.pid
          fi
          if [ -f disk.log ]; then
            echo "=== Lowest free space observed ==="
            grep -oE '[0-9.]+[MG]? +[0-9]+%' disk.log | tail -n 5 || true
            echo "=== Last samples ==="
            tail -n 20 disk.log || true
          fi
          df -h /
      - name: Upload disk log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-log
          path: disk.log
          if-no-files-found: ignore
