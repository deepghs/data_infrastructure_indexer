#file: noinspection YAMLSchemaValidation
name: ATFBooru Index

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop fetching after this duration, leaving room for the final upload'
        required: false
        default: '5h'
      max_empty_pages:
        description: 'Stop after this many consecutive pages with nothing new. Raise it to walk
          past a stretch that is already indexed.'
        required: false
        default: '10'
  # Off until the authenticated backfill has landed and been audited. Two runs must not overlap:
  # every deploy rewrites records.parquet wholesale, so whichever commits second wins.
  #  schedule:
  #    - cron: '30 5 * * 2,5'

jobs:
  atf_index:
    name: ATFBooru Index
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Run atfbooru index
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_ATF: ${{ secrets.REMOTE_REPOSITORY_ATF }}
          ATFBOORU_USERNAME: ${{ secrets.ATFBOORU_USERNAME }}
          ATFBOORU_APIKEY: ${{ secrets.ATFBOORU_APIKEY }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_EMPTY_PAGES: ${{ github.event.inputs.max_empty_pages || '10' }}
        shell: bash
        run: |
          python -m inf.atfbooru.index \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-empty-pages "$MAX_EMPTY_PAGES"
