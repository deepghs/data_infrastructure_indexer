#file: noinspection YAMLSchemaValidation
name: Anime Pictures Index

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop fetching after this duration, leaving room for the final upload'
        required: false
        default: '5h'
      max_empty_pages:
        description: 'Stop after this many consecutive listing pages with nothing new. Raise it
          to walk past a stretch that is already indexed.'
        required: false
        default: '10'
      no_recent:
        description: 'Hold back posts published more recently than this, so tags and scores have
          settled before a post is recorded.'
        required: false
        default: '15d'
  # Left off until the first full run has been verified.
  #
  # The site publishes roughly 420 posts a week, measured across four sampling depths (620/week
  # over the last 9 days, 415-423/week over 1 to 4 months). Twice a week therefore collects
  # about 210 posts a run, a few minutes of work, while giving a missed run a second chance
  # before the backlog is worth noticing. Going more often would mostly re-download the 258 MB
  # table to add nothing, since `--no-recent` holds back anything younger than 15 days anyway.
  #  schedule:
  #    - cron: '0 8 * * 1,4'

jobs:
  ap_index:
    name: Anime Pictures Index
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Run anime pictures index
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_AP: ${{ secrets.REMOTE_REPOSITORY_AP }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_EMPTY_PAGES: ${{ github.event.inputs.max_empty_pages || '10' }}
          NO_RECENT: ${{ github.event.inputs.no_recent || '15d' }}
        shell: bash
        run: |
          python -m inf.anime_pictures.index \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-empty-pages "$MAX_EMPTY_PAGES" \
            --no-recent "$NO_RECENT"
