#file: noinspection YAMLSchemaValidation
name: EShuushuu Index

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop fetching after this duration, leaving room for the final upload'
        required: false
        default: '5h'
      max_empty_pages:
        description: 'Stop after this many consecutive pages carrying no id we have not seen
          before.'
        required: false
        default: '20'
      start_page:
        description: 'First page to request. The site pages by offset with no cursor, so a sweep
          that ran out of time resumes by page number.'
        required: false
        default: '1'
      workers:
        description: 'Concurrent fetchers. The site tolerated eight without throttling; six is
          the default since the returns past that are small.'
        required: false
        default: '6'
  # Off until the rebuild sweep has landed and been audited. Runs must not overlap: a deploy
  # rewrites table.parquet whole, so whichever finishes second replaces the other's work.
  #  schedule:
  #    - cron: '0 0 * * *'

jobs:
  ess_index:
    name: EShuushuu Index
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Run eshuushuu index
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_ESS: ${{ secrets.REMOTE_REPOSITORY_ESS }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_EMPTY_PAGES: ${{ github.event.inputs.max_empty_pages || '20' }}
          START_PAGE: ${{ github.event.inputs.start_page || '1' }}
          WORKERS: ${{ github.event.inputs.workers || '6' }}
          # Fallback route only. The site refuses datacentre addresses with a Cloudflare
          # interstitial, so a direct attempt is made first and the pool is billed per request.
          BRD_PROXY_URL: ${{ secrets.BRD_PROXY_URL }}
          BRD_API_KEY: ${{ secrets.BRD_API_KEY }}
          BRD_ZONE: ${{ secrets.BRD_ZONE }}
        shell: bash
        run: |
          python -m inf.eshuushuu.index \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-empty-pages "$MAX_EMPTY_PAGES" \
            --start-page "$START_PAGE" \
            --workers "$WORKERS"
