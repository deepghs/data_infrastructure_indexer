#file: noinspection YAMLSchemaValidation
name: Danbooru Quick DL

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop the run after this duration (e.g. 5h, 20m, none)'
        required: false
        default: '5h'
      max_volume_files:
        description: 'Maximum entries per tar volume'
        required: false
        default: '20000'
      max_volume_bytes:
        description: 'Approximate byte budget per tar volume'
        required: false
        default: '21474836480'
      max_volume_hard_bytes:
        description: 'Hard ceiling on bytes actually written into one tar'
        required: false
        default: '25769803776'
      session_pool_size:
        description: 'Session pool size (0 = workers + 4)'
        required: false
        default: '0'
      max_volumes:
        description: 'Stop after this many volumes (empty means unlimited)'
        required: false
        default: ''
      download_workers:
        description: 'Concurrent download threads'
        required: false
        default: '16'
      use_brightdata:
        description: 'Route downloads through the Bright Data proxy pool (default off; the direct route is faster)'
        required: false
        default: 'false'
  # Target cadence is every 8 hours. Kept commented until the job has proven itself,
  # matching how the other schedules in this repository are staged back in.
  #  schedule:
  #    - cron: '17 */8 * * *'

jobs:
  quick_dl:
    name: Danbooru Quick DL
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload to finish.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          # 3.8 pins curl_cffi to 0.9.0, whose impersonation targets are years out of date.
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Free disk space
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          echo "=== Before ==="
          df -h /
          # Preinstalled toolchains this job never uses; removing them roughly doubles the
          # space available for tar volumes.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "=== After ==="
          df -h /
      - name: Set up system dependencies on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          df -h /
          free -h
      - name: Start disk monitor
        shell: bash
        run: |
          nohup bash -c 'while true; do echo "=== $(date -Is) ==="; df -h / | tail -n 1; sleep 60; done' > disk.log 2>&1 &
          echo $! > disk-monitor.pid
      - name: Run quick_dl
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_HUB_ENABLE_HF_TRANSFER: '1'
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_DB_N: ${{ secrets.REMOTE_REPOSITORY_DB_N }}
          REMOTE_REPOSITORY_DB_N_DL: ${{ secrets.REMOTE_REPOSITORY_DB_N_DL }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_VOLUME_FILES: ${{ github.event.inputs.max_volume_files || '20000' }}
          MAX_VOLUME_BYTES: ${{ github.event.inputs.max_volume_bytes || '21474836480' }}
          MAX_VOLUME_HARD_BYTES: ${{ github.event.inputs.max_volume_hard_bytes || '25769803776' }}
          SESSION_POOL_SIZE: ${{ github.event.inputs.session_pool_size || '0' }}
          MAX_VOLUMES: ${{ github.event.inputs.max_volumes || '' }}
          DOWNLOAD_WORKERS: ${{ github.event.inputs.download_workers || '16' }}
          USE_BRIGHTDATA: ${{ github.event.inputs.use_brightdata || 'false' }}
          BRD_PROXY_URL: ${{ secrets.BRD_PROXY_URL }}
          BRD_API_KEY: ${{ secrets.BRD_API_KEY }}
          BRD_ZONE: ${{ secrets.BRD_ZONE }}
        shell: bash
        run: |
          EXTRA=()
          if [ -n "$MAX_VOLUMES" ]; then
            EXTRA+=(--max-volumes "$MAX_VOLUMES")
          fi
          # Opt-in only. The direct route is metered but never blocked, while shared datacenter
          # proxy exits are refused outright by the CDN, so proxying is the slower default.
          if [ "$USE_BRIGHTDATA" = "true" ] && [ -n "$BRD_PROXY_URL" ]; then
            echo "Routing downloads through the Bright Data proxy pool."
            export PP_DB="$BRD_PROXY_URL"
          fi
          python -m inf.danbooru.quick_dl \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-volume-files "$MAX_VOLUME_FILES" \
            --max-volume-bytes "$MAX_VOLUME_BYTES" \
            --max-volume-hard-bytes "$MAX_VOLUME_HARD_BYTES" \
            --session-pool-size "$SESSION_POOL_SIZE" \
            --download-workers "$DOWNLOAD_WORKERS" \
            "${EXTRA[@]}"
      - name: Stop disk monitor
        if: always()
        shell: bash
        run: |
          if [ -f disk-monitor.pid ]; then
            kill "$(cat disk-monitor.pid)" 2>/dev/null || true
            rm -f disk-monitor.pid
          fi
          if [ -f disk.log ]; then
            echo "=== Lowest free space observed ==="
            grep -oE '[0-9.]+[MG]? +[0-9]+%' disk.log | tail -n 5 || true
            echo "=== Last samples ==="
            tail -n 20 disk.log || true
          fi
          df -h /
      - name: Upload disk log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disk-log
          path: disk.log
          if-no-files-found: ignore
