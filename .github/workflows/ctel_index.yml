#file: noinspection YAMLSchemaValidation
name: Cosplaytele Index

on:
  workflow_dispatch:
    inputs:
      max_time_limit:
        description: 'Stop fetching after this duration, leaving room for the final upload'
        required: false
        default: '5h'
      max_empty_pages:
        description: 'Stop after this many consecutive listing pages with nothing new. 0 walks the
          whole listing, which is how a full rebuild is done.'
        required: false
        default: '10'
  # Once a day. The site publishes roughly 45 posts a month, so a daily run collects one or two:
  # a handful of listing pages plus the ten spent confirming nothing older is missing. The tables
  # are rewritten whole on each deploy, so two runs must never overlap - whichever uploads second
  # replaces the other's work. Do not dispatch a manual run while a scheduled one is in flight.
  schedule:
    - cron: '25 3 * * *'

jobs:
  ctel_index:
    name: Cosplaytele Index
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes; leave room for the final upload.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run cosplaytele index
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_CTEL: ${{ secrets.REMOTE_REPOSITORY_CTEL }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          MAX_EMPTY_PAGES: ${{ github.event.inputs.max_empty_pages || '10' }}
        shell: bash
        run: |
          python -m inf.cosplaytele.index \
            --max-time-limit "$MAX_TIME_LIMIT" \
            --max-empty-pages "$MAX_EMPTY_PAGES"
