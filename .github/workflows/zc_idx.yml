#file: noinspection YAMLSchemaValidation
name: Zerochan Index

on:
  #  push:
  workflow_dispatch:
    inputs:
      max_empty_pages:
        description: 'Stop after this many consecutive listing pages with nothing new. 10 for
          day-to-day catch-up; raise it (e.g. 2000) to backfill past an already-covered stretch.'
        required: false
        default: '10'
      max_time_limit:
        description: 'Stop fetching after this duration, leaving room for the final upload'
        required: false
        default: '5h'
      start_from_id:
        description: 'Begin the descending walk at this post id instead of the site head. The
          API only pages downwards, so to fill a gap you start just above it. Empty = head.'
        required: false
        default: ''
      extra_id_ranges:
        description: 'Fetch these ids directly before walking, as `lo-hi,lo-hi`. Some posts
          never appear in the listing at all, so paging can never reach them.'
        required: false
        default: ''
      try_failed_ids_first:
        description: 'Retry the ids in meta.json failed_ids before walking. Most of those
          entries are posts whose JSON could not be parsed before json_repair existed.'
        required: false
        default: 'false'
  # Two runs must never overlap. Every deploy rewrites zerochan.parquet and meta.json wholesale
  # with no merge step, so each run reads a snapshot at startup, adds its own rows and writes the
  # whole thing back - whichever commits second erases what the other collected. Before starting
  # a manual backfill alongside this schedule, check that no run is in flight, and prefer to let
  # the scheduled one finish.
  #
  # A scheduled run supplies no inputs, so everything falls through to the `||` defaults below:
  # head-only walk, 10-page patience, 5h budget, no start id and no explicit id ranges. That is
  # the right shape for keeping up with new posts. Backfilling is a manual dispatch.
  schedule:
    - cron: '0 */12 * * *'

jobs:
  unittest:
    name: Code Test Newest
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes. The run stops fetching at --max-time-limit (5h)
    # and then still has to upload the whole parquet, which measured 16 minutes at 723 MB, so
    # leave clear room for that rather than racing the ceiling.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependences on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree cloc wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flake8 setuptools wheel twine
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          pip list
          tree .
          cloc inf
          cloc test
      - name: Run unittest
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_ZC: ${{ secrets.REMOTE_REPOSITORY_ZC }}
          ZEROCHAN_USERNAME: ${{ secrets.ZEROCHAN_USERNAME }}
          ZEROCHAN_PASSWORD: ${{ secrets.ZEROCHAN_PASSWORD }}
          MAX_EMPTY_PAGES: ${{ github.event.inputs.max_empty_pages || '10' }}
          MAX_TIME_LIMIT: ${{ github.event.inputs.max_time_limit || '5h' }}
          START_FROM_ID: ${{ github.event.inputs.start_from_id || '' }}
          TRY_FAILED_IDS_FIRST: ${{ github.event.inputs.try_failed_ids_first || 'false' }}
          EXTRA_ID_RANGES: ${{ github.event.inputs.extra_id_ranges || '' }}
        shell: bash
        run: |
          EXTRA=()
          # The walk is strictly descending, matching the API, so a targeted backfill sets its
          # start just above the gap it means to close.
          if [ -n "$START_FROM_ID" ]; then
            EXTRA+=(--start-from-id "$START_FROM_ID")
          fi
          if [ "$TRY_FAILED_IDS_FIRST" = "true" ]; then
            EXTRA+=(--try-failed-ids-first)
          fi
          if [ -n "$EXTRA_ID_RANGES" ]; then
            EXTRA+=(--extra-id-ranges "$EXTRA_ID_RANGES")
          fi
          python -m inf.zerochan.index \
            --max-empty-pages "$MAX_EMPTY_PAGES" \
            --max-time-limit "$MAX_TIME_LIMIT" \
            "${EXTRA[@]}"
