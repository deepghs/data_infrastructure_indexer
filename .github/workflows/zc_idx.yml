#file: noinspection YAMLSchemaValidation
name: Zerochan Index

on:
  #  push:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 */12 * * *'

jobs:
  unittest:
    name: Code Test Newest
    runs-on: ${{ matrix.os }}
    # GitHub hard-kills a job at 360 minutes. The run stops fetching at --max-time-limit (5h)
    # and then still has to upload the whole parquet, which measured 16 minutes at 723 MB, so
    # leave clear room for that rather than racing the ceiling.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        os:
          - 'ubuntu-latest'
        python-version:
          # json_repair requires >=3.10, and zerochan's malformed JSON cannot be parsed
          # without it. On 3.8 pip would silently resolve to an ancient release whose repair
          # behaviour is not what was verified here.
          - '3.11'

    steps:
      - name: Get system version for Linux
        if: ${{ contains(matrix.os, 'ubuntu') }}
        shell: bash
        run: |
          echo "OS_NAME=Linux" >> $GITHUB_ENV
          echo "IS_WIN=" >> $GITHUB_ENV
          echo "IS_MAC=" >> $GITHUB_ENV
      - name: Set environment for Cpython
        if: ${{ !contains(matrix.python-version, 'pypy') }}
        shell: bash
        run: |
          echo "IS_PYPY=" >> $GITHUB_ENV
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 20
          submodules: 'recursive'
      - name: Set up system dependences on Linux
        if: ${{ env.OS_NAME == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tree cloc wget curl make zip
          sudo apt-get install -y git-lfs
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade flake8 setuptools wheel twine
          pip install -r requirements.txt
      - name: Test the basic environment
        shell: bash
        run: |
          python -V
          pip --version
          pip list
          tree .
          cloc inf
          cloc test
      - name: Run unittest
        env:
          CI: 'true'
          HF_ENDPOINT: ${{ secrets.HF_ENDPOINT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REMOTE_REPOSITORY_ZC: ${{ secrets.REMOTE_REPOSITORY_ZC }}
          ZEROCHAN_USERNAME: ${{ secrets.ZEROCHAN_USERNAME }}
          ZEROCHAN_PASSWORD: ${{ secrets.ZEROCHAN_PASSWORD }}
        shell: bash
        run: |
          python -m inf.zerochan.index
